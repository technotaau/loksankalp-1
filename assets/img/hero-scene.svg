<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="ls-hero-title">
  <title id="ls-hero-title">भोर के उजाले में एक भारतीय गाँव — खेत, विद्यालय, ग्राम सभा और परिवार</title>
  <defs>
    <linearGradient id="hsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4EEF7"/>
      <stop offset=".55" stop-color="#F3F2EC"/>
      <stop offset="1" stop-color="#FDECD8"/>
    </linearGradient>
    <radialGradient id="hsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5B301" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#F5B301" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hsField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B7A34" stop-opacity=".10"/>
      <stop offset="1" stop-color="#1B7A34" stop-opacity=".22"/>
    </linearGradient>
    <g id="hsTree">
      <path d="M0 0v-46" stroke="#1B7A34" stroke-opacity=".30" stroke-width="7" fill="none"/>
      <circle cx="-16" cy="-58" r="20" fill="#1B7A34" opacity=".18"/>
      <circle cx="16" cy="-56" r="18" fill="#1B7A34" opacity=".18"/>
      <circle cx="0" cy="-74" r="24" fill="#1B7A34" opacity=".22"/>
      <circle cx="0" cy="-54" r="19" fill="#1B7A34" opacity=".22"/>
    </g>
    <g id="hsPerson" fill="#16192B" opacity=".24">
      <circle cx="0" cy="-46" r="7.5"/>
      <path d="M-8-37q8-4 16 0l-2 20h-12z"/>
      <path d="M-5-18-6 0h4l2-14 2 14h4l-1-18z"/>
    </g>
    <g id="hsChild" fill="#16192B" opacity=".22">
      <circle cx="0" cy="-29" r="5.5"/>
      <path d="M-6-22q6-3 12 0l-1.5 13h-9z"/>
      <path d="M-4-11-5 0h3l1.5-8 1.5 8h3l-1-11z"/>
    </g>
  </defs>

  <g id="hs-sky">
    <rect width="1440" height="470" fill="url(#hsSky)"/>
    <g fill="#FFFFFF" opacity=".55">
      <ellipse cx="250" cy="120" rx="96" ry="26"/>
      <ellipse cx="320" cy="106" rx="64" ry="22"/>
      <ellipse cx="880" cy="86" rx="110" ry="24"/>
      <ellipse cx="960" cy="100" rx="70" ry="20"/>
      <ellipse cx="1300" cy="150" rx="88" ry="22"/>
    </g>
  </g>

  <g id="hs-sun" transform="translate(140 -20)">
    <circle cx="1108" cy="318" r="210" fill="url(#hsGlow)"/>
    <circle cx="1108" cy="318" r="74" fill="#F5B301" opacity=".26"/>
    <g stroke="#E8730C" stroke-opacity=".20" stroke-width="7" stroke-linecap="round">
      <path d="M1108 222v-42M1108 456v-42M1012 318h-42M1246 318h-42"/>
      <path d="M1040 250l-30-30M1206 416l-30-30M1176 250l30-30M1010 416l30-30"/>
    </g>
  </g>

  <linearGradient id="hsHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFDF8" stop-opacity="0"/>
    <stop offset="1" stop-color="#FFFDF8" stop-opacity=".7"/>
  </linearGradient>

  <g id="hs-hills" fill="#17307A">
    <path d="M0 432q120-58 246-40 118 17 190 40z" opacity=".08"/>
    <path d="M1440 432q-150-70-300-46-140 22-214 46z" opacity=".08"/>
    <path d="M430 432q130-46 268-30 120 14 200 30z" opacity=".06"/>
  </g>

  <rect id="hs-haze" y="378" width="1440" height="56" fill="url(#hsHaze)"/>

  <g id="hs-fields">
    <rect y="430" width="1440" height="290" fill="url(#hsField)"/>
    <g stroke="#1B7A34" stroke-opacity=".14" stroke-width="3" fill="none">
      <path d="M0 470h1440M0 500h1440"/>
      <path d="M-40 560q360-26 760 0t760 0"/>
      <path d="M-40 620q360-30 760 0t760 0"/>
      <path d="M-40 684q360-32 760 0t760 0"/>
    </g>
    <g fill="#1B7A34" opacity=".13">
      <path d="M0 470q220 34 470 24 300-12 500 22 250 8 470-14v-42H0z"/>
    </g>
  </g>

  <g id="hs-village">
    <g fill="#17307A" opacity=".17">
      <path d="M150 432v-52h84v52z"/>
      <path d="M132 384l60-40 60 40z"/>
      <path d="M262 432v-40h64v40z"/>
      <path d="M248 396l46-32 46 32z"/>
      <path d="M78 432v-34h56v34z"/>
      <path d="M66 402l40-28 40 28z"/>
    </g>
    <g id="hs-temple" fill="#17307A" opacity=".22">
      <path d="M352 432v-56h72v56z"/>
      <path d="M388 274l30 44q18 26 0 52-30 14-60 0-18-26 0-52z"/>
      <path d="M384 268h8v-16h-8z"/>
      <circle cx="388" cy="248" r="6"/>
    </g>
    <g fill="#FFFDF8" opacity=".5">
      <path d="M180 432v-30h24v30zM286 432v-22h20v22zM378 432v-26h20v26z"/>
    </g>
  </g>

  <g id="hs-school" transform="translate(-46 0)">
    <g fill="#17307A" opacity=".16">
      <path d="M968 434v-84h224v84z"/>
      <path d="M950 350l130-40 130 40z"/>
    </g>
    <g fill="#FFFDF8" opacity=".55">
      <path d="M998 400v-30h30v30zM1064 400v-30h30v30zM1130 400v-30h30v30z"/>
      <path d="M1064 434v-24h30v24z"/>
    </g>
    <g id="hs-flag">
      <path d="M1078 310v-70" stroke="#17307A" stroke-opacity=".26" stroke-width="4" fill="none"/>
      <path d="M1080 244h46l-12 14 12 14h-46z" fill="#E8730C" opacity=".3"/>
    </g>
  </g>

  <g id="hs-trees">
    <use href="#hsTree" transform="translate(560 438)"/>
    <use href="#hsTree" transform="translate(690 432) scale(.8)"/>
    <use href="#hsTree" transform="translate(1300 450) scale(1.15)"/>
    <use href="#hsTree" transform="translate(96 448) scale(.9)"/>
    <use href="#hsTree" transform="translate(870 430) scale(.7)"/>
  </g>

  <g id="hs-people">
    <g id="hs-teacher" transform="translate(940 620) scale(1.12)">
      <path d="M-96-96h84v66h-84z" fill="#17307A" opacity=".16"/>
      <g stroke="#FFFDF8" stroke-opacity=".5" stroke-width="3" fill="none">
        <path d="M-84-78h50M-84-64h34"/>
      </g>
      <use href="#hsPerson" transform="translate(10 0) scale(1.25)"/>
      <use href="#hsChild" transform="translate(58 0)"/>
      <use href="#hsChild" transform="translate(84 0) scale(.92)"/>
      <use href="#hsChild" transform="translate(110 0)"/>
    </g>

    <g id="hs-sabha" transform="translate(360 648)">
      <ellipse cx="0" cy="6" rx="128" ry="30" fill="#17307A" opacity=".10"/>
      <use href="#hsPerson" transform="translate(-104 -6) scale(.86)"/>
      <use href="#hsPerson" transform="translate(-58 -16) scale(.78)"/>
      <use href="#hsPerson" transform="translate(-6 -20) scale(.74)"/>
      <use href="#hsPerson" transform="translate(46 -16) scale(.78)"/>
      <use href="#hsPerson" transform="translate(96 -6) scale(.86)"/>
      <use href="#hsPerson" transform="translate(-72 26) scale(.96)"/>
      <use href="#hsPerson" transform="translate(-16 32) scale(1)"/>
      <use href="#hsPerson" transform="translate(44 30) scale(.98)"/>
    </g>

    <g id="hs-family" transform="translate(1200 664) scale(1.2)">
      <use href="#hsPerson" transform="translate(-30 0)"/>
      <use href="#hsChild" transform="translate(0 0)"/>
      <use href="#hsPerson" transform="translate(30 0) scale(.96)"/>
      <g stroke="#16192B" stroke-opacity=".22" stroke-width="3.4" stroke-linecap="round" fill="none">
        <path d="M-22-32-7-24M22-32 7-24"/>
      </g>
    </g>
  </g>

  <path id="hs-veil" d="M0 470h1440v250H0z" fill="#FFFDF8" opacity=".22"/>
</svg>
