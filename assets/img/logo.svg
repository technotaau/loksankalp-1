<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ls-logo-title">
  <title id="ls-logo-title">लोकसंकल्प — नशे की सामाजिक स्वीकृति के विरुद्ध जनआंदोलन</title>
  <defs>
