    <g fill="none" stroke="#17307A" stroke-width="3.5" stroke-linecap="round">
      <path d="M190 435q20-11 36-5"/>
      <path d="M322 435q-20-11-36-5"/>
    </g>
  </g>

  <text id="lg-text-bottom" font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',Georgia,serif"
        font-weight="700" font-size="20" fill="#17307A" letter-spacing="0.3">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">नशे को नहीं, संस्कारों को सामाजिक स्वीकृति</textPath>
