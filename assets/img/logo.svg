          <rect x="-4" y="-13" width="8" height="4" rx="1.2"/>
          <rect x="-6.5" y="-18" width="3.5" height="14" rx="1.5"/>
          <rect x="22" y="-12.2" width="11" height="2.4" rx="1.2"/>
        </g>
        <rect x="6" y="12" width="22" height="11" rx="5.5" transform="rotate(-25 17 17.5)"/>
        <rect x="-3" y="20" width="20" height="10" rx="5" transform="rotate(-25 7 25)"/>
