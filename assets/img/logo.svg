    <path id="arcTop" fill="none" d="M68.06 187.6A200 200 0 0 1 443.94 187.6"/>
    <path id="arcBot" fill="none" d="M47.4 331.9A222 222 0 0 0 464.6 331.9"/>
    <g id="fig" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-86" r="13" stroke="none"/>
      <path d="M-12-70q12-5 24 0l-2 33q-10 4-20 0z" stroke="none"/>
      <path d="M-12-68-31-93M12-68 31-93" fill="none" stroke-width="9"/>
      <path d="M-7-37-10 0M7-37 10 0" fill="none" stroke-width="9"/>
    </g>
  </defs>

  <g id="lg-ring" fill="none" stroke-linecap="round" stroke-width="10">
