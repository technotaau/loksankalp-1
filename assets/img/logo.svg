    <path d="M494.68 281.08A240 240 0 0 1 17.32 281.08" stroke="url(#ringB)"/>
  </g>

  <g id="lg-text-top" font-family="'Tiro Devanagari Hindi','Noto Serif Devanagari',Georgia,serif" font-weight="700">
