      <stop offset="1" stop-color="#F5B301"/>
    </linearGradient>
    <linearGradient id="ringB" gradientUnits="userSpaceOnUse" x1="495" y1="281" x2="17" y2="281">
      <stop offset="0" stop-color="#F5B301"/>
      <stop offset="1" stop-color="#1B7A34"/>
    </linearGradient>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
