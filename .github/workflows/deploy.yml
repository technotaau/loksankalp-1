name: Deploy to GitHub Pages

# GitHub Pages for this repo is served from the `gh-pages` branch, so this
# workflow validates `main` and then fast-forwards `gh-pages` to it.
#
# To move to the newer "GitHub Actions" Pages source instead:
#   Settings → Pages → Source: GitHub Actions,
# then swap the `publish` job for actions/configure-pages + upload-pages-artifact
# + deploy-pages. Note that a workflow's GITHUB_TOKEN cannot create the Pages
# site itself — that needs `administration: write`, which is not grantable here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate HTML, links, a11y and SEO
        run: python3 tools/check.py

      - name: Publish to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages "pages build and deployment" job never fires for the push above and
      # the branch updates without the site being rebuilt. Say so loudly rather
      # than reporting a green deploy that published nothing.
      - name: Warn if Pages did not rebuild
        run: |
          echo "::warning::gh-pages updated, but a GITHUB_TOKEN push cannot trigger the Pages build."
          echo "::warning::Fix once in Settings -> Pages -> Source: GitHub Actions, then switch this"
          echo "::warning::job to configure-pages + upload-pages-artifact + deploy-pages."

      - name: Wait for the deployment to serve
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L "$url" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && { echo "live at $url"; exit 0; }
            sleep 15
          done
          echo "::warning::site did not return 200 within 5 minutes; check Settings → Pages"
