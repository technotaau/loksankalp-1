# Pages source is "GitHub Actions", so a push to main builds and deploys
# directly — no gh-pages branch, no manual publish step.
name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deployments from the repository's
    # default branch, which is still claude/website-hindi-content-build-f4hhg9.
    # Once the default branch is set to main, drop that second entry.
    branches: [main, claude/website-hindi-content-build-f4hhg9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, links, a11y and SEO
        run: python3 tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
